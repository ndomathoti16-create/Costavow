name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop, cloud, and verification dependencies
        run: python -m pip install -r requirements.txt -e ".[cloud,desktop,dev]"
      - name: Verify release source
        shell: bash
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q app.py src tests data/demo
          python -m bandit -q -r src app.py
          python -m pip_audit --local
      - name: Generate third-party license bundle
        run: python packaging/generate_third_party_licenses.py --output THIRD_PARTY_LICENSES.txt
      - name: Build portable Costavow application
        run: python -m PyInstaller packaging/costavow.spec --noconfirm --clean
      - name: Package Windows download
        shell: powershell
        run: Compress-Archive -Path dist\Costavow.exe,PRIVACY.md,SECURITY.md,THIRD_PARTY_NOTICES.md,THIRD_PARTY_LICENSES.txt -DestinationPath dist\Costavow-Windows-x64.zip
      - name: Verify a Windows-marked download starts natively
        shell: powershell
        run: ./packaging/check_windows_release.ps1
      - name: Create release checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\Costavow-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Costavow-Windows-x64.zip" | Set-Content dist\SHA256SUMS.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Costavow-Windows-x64
          path: |
            dist/Costavow-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Prepare tagged GitHub release for verification
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "dist\Costavow-Windows-x64.zip#Costavow-Windows-x64.zip" "dist\SHA256SUMS.txt#SHA256SUMS.txt" `
            --title "Costavow $tag" `
            --generate-notes `
            --draft `
            --verify-tag
